[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streeteasy-unofficial"
version = "0.2.0"
description = "A typed local monitoring SDK for StreetEasy rental searches"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pranjay Kumar" }]
keywords = ["streeteasy", "real-estate", "graphql", "nyc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Pranjay-kumar/streeteasy-unofficial"
Issues = "https://github.com/Pranjay-kumar/streeteasy-unofficial/issues"

[project.optional-dependencies]
browser = ["patchright==1.61.2"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.15", "twine>=6"]

[project.scripts]
streeteasy = "streeteasy_unofficial.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streeteasy_unofficial"]

[tool.hatch.build.targets.wheel.force-include]
"src/streeteasy_unofficial/data/areas.json" = "streeteasy_unofficial/data/areas.json"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
